# Nakama + Postgres 로컬 개발 스택 (§12)
# 사용: 1) npm install && npm run build  → build/index.js 생성
#       2) .env 에 SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY 채우기
#       3) docker compose up
#
# 주의: 이 Postgres 는 Nakama 자체 저장소다(세션/스토리지). 경제 데이터는 별도 Supabase 에 있다.
services:
  postgres:
    image: postgres:15-alpine
    container_name: rpg-nakama-db
    environment:
      - POSTGRES_DB=nakama
      - POSTGRES_PASSWORD=localdb
      - POSTGRES_USER=postgres
    volumes:
      - nakama-data:/var/lib/postgresql/data
    # Nakama 내부 전용 DB. 도커 네트워크 안에서 'postgres:5432' 로만 접근하므로
    # 호스트 포트로 노출하지 않는다(호스트 5432 충돌 방지). 호스트에서 직접 붙어야 하면
    # 아래를 'ports: ["5433:5432"]' 처럼 다른 호스트 포트로 매핑할 것.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "nakama"]
      interval: 3s
      timeout: 3s
      retries: 10

  nakama:
    image: heroiclabs/nakama:3.22.0
    container_name: rpg-nakama
    # 주의: folded 스칼라(>)에서는 모든 줄의 들여쓰기를 동일하게 유지해야 한다.
    # 한 줄이라도 더 들여쓰면 YAML 이 줄바꿈을 보존해 명령이 끊긴다(플래그 누락 → DB 기본값으로 붙음).
    entrypoint:
      - "/bin/sh"
      - "-ecx"
      - >
        /nakama/nakama migrate up
        --database.address postgres:localdb@postgres:5432/nakama &&
        exec /nakama/nakama
        --config /nakama/data/local.yml
        --database.address postgres:localdb@postgres:5432/nakama
        --runtime.env "SUPABASE_URL=${SUPABASE_URL}"
        --runtime.env "SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./:/nakama/data
    expose:
      - "7349"
      - "7350"
      - "7351"
    ports:
      - "7349:7349"   # gRPC API
      - "7350:7350"   # HTTP API (Dart 클라이언트가 사용)
      - "7351:7351"   # Nakama Console (http://localhost:7351, admin/password)
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  nakama-data:
